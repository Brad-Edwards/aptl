# APTL SSH policy for the shared Ubuntu substrate.
#
# /etc/ssh/sshd_config includes this directory near the top of the file and
# OpenSSH keeps the FIRST value it sees for a keyword, so a drop-in that sorts
# early wins over anything the distribution sets later in the vendor file.
# Editing that vendor file in place is what broke on newer Ubuntu; this file
# states the policy once, for whatever layout the distribution ships.
#
# Image-specific SSH settings (Kali's AcceptEnv and Match blocks, for example)
# belong in that image, not in this generic substrate.
PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
