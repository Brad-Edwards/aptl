sonar.projectKey=Brad-Edwards_aptl
sonar.organization=brad-edwards

sonar.sources=src,mcp,web/src
sonar.tests=tests,mcp/aptl-mcp-common/tests,web/tests
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/dist/**,**/.venv/**,**/build/**,**/*.pyc,**/containers/**,mcp/**/tests/**,web/**/tests/**
sonar.coverage.exclusions=**/*.svelte

sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml,coverage/transport.xml

sonar.typescript.lcov.reportPaths=mcp/**/coverage/lcov.info,web/coverage/lcov.info

# lab.py is the legacy orchestration facade; issue-specific cleanup lives in
# extracted helpers, but the public import/patch surface remains intentionally
# stable for now.
