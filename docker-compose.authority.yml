# Backend-owned Docker authority apparatus. Composed only when the admitted
# plan carries an orchestration authority, and it is what that authority
# actually reaches: the declaring workload is given this mediated socket at its
# declared path while the host's own socket stays here, behind authorization.
#
# `source` values are rewritten from the realization before use; the literals
# below are placeholders so the model is readable, never a second source of
# truth (see _compose_docker_authority.py).
services:
  docker-authority-proxy:
    profiles: ["soc"]
    build:
      context: .
      dockerfile: containers/docker-authority-proxy/Dockerfile
    container_name: aptl-docker-authority-proxy
    restart: unless-stopped
    init: true
    # Rewritten to the invoking uid/gid plus the host daemon socket's group.
    # The first identity owns the mediated socket directory; the supplemental
    # group reaches the upstream Docker socket without running as root.
    user: generated:docker-authority-user
    group_add: [generated:docker-socket-group]
    read_only: true
    # The proxy talks to the daemon and to its own socket directory. It joins
    # no scenario network, so a compromised in-world workload cannot reach it
    # other than through the socket it is meant to use.
    network_mode: "none"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: false
      - type: bind
        source: generated:docker-authority-socket-dir
        target: /run/aptl-docker-authority
        read_only: false
    environment:
      APTL_DOCKER_AUTHORITY_SOCKET: /run/aptl-docker-authority/docker.sock
      APTL_DOCKER_AUTHORITY_UPSTREAM: /var/run/docker.sock
      APTL_DOCKER_AUTHORITY_IMAGES: ""
      APTL_DOCKER_AUTHORITY_NETWORKS: ""
      APTL_DOCKER_AUTHORITY_OWNER_LABEL: ""
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The declaring workload bind-mounts this socket as a file, so it has to
      # exist before that container is created or Docker would put a directory
      # in its place. The dependency below waits on this check.
      test:
        - CMD-SHELL
        - >-
          python3 -c "import socket,sys;
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM);
          s.connect('/run/aptl-docker-authority/docker.sock');
          s.sendall(b'GET /_ping HTTP/1.1\r\nHost: localhost\r\n\r\n');
          sys.exit(0 if b'200' in s.recv(64) else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
