name: Release Please

# Automated releases with release-please. On pushes to main it maintains a
# release PR (version bump + CHANGELOG.md, derived from Conventional Commit
# history). Merging that PR creates the git tag + GitHub Release; the publish
# job then builds and uploads to PyPI via OIDC trusted publishing.
#
# Third-party actions are pinned to commit SHAs (Dependabot keeps them current).
on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release tag + GitHub Release
      pull-requests: write   # open/maintain the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write        # upload release assets
      id-token: write        # OIDC trusted publishing to PyPI + provenance signing
      attestations: write    # record SLSA build provenance for the release artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        # Release tooling comes from the hashed CI export so the artifact that
        # ships to PyPI is produced by a known-good toolchain (issue #847).
        run: |
          pip install --require-hashes -r requirements/ci.txt
          python -m build --no-isolation

      - name: Generate CycloneDX SBOM
        # Install the locked runtime set plus the freshly built wheel (with
        # --no-deps, so pip resolves nothing off-lock). The SBOM then describes
        # exactly the dependency versions uv.lock pins, rather than whatever pip
        # happened to resolve at release time.
        run: |
          pip install --require-hashes -r requirements/runtime.txt
          pip install dist/*.whl --no-deps
          mkdir -p sbom
          cyclonedx-py environment --output-format JSON --output-file sbom/aptl.cdx.json

      # Sign the built artifacts with a SLSA build-provenance attestation
      # (issue #847). Sigstore keyless signing via the job's OIDC token — no key
      # material to hold or rotate. This runs BEFORE publishing so nothing
      # unattested can reach PyPI if signing fails.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

      - name: Attach artifacts to the GitHub Release
        # The attestation bundle is also attached as a release asset, not just
        # recorded in the attestations API: a consumer verifying a downloaded
        # tarball (and OpenSSF Scorecard's Signed-Releases check) looks for a
        # `.intoto.jsonl` sibling of the artifact.
        #
        # BUNDLE and TAG go through the environment rather than being
        # interpolated into the shell, so no workflow expression is ever parsed
        # as shell.
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "dist/aptl-labs-${TAG}.intoto.jsonl"
          gh release upload "$TAG" dist/* sbom/* --clobber

  publish-appliance-images:
    name: Build exact-source appliance images
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: [self-hosted, linux, x64, aptl-seat-image]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Build and publish exact-source images
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: scripts/appliance/publish-images.sh

  publish-seat-image:
    name: Bake and publish the seat VM image
    needs: [release-please, publish-appliance-images]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # A dedicated runner needs enough disk for Docker images, an archive,
    # the offline payload, and the VM disk at the same time. Standard hosted
    # Ubuntu runners have only 14 GB and cannot perform this bake.
    runs-on: [self-hosted, linux, x64, aptl-seat-image]
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
      - name: Check bake workspace capacity
        run: |
          set -euo pipefail
          available=$(df -PB1 "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')
          if test "$available" -lt $((120 * 1024 * 1024 * 1024)); then
            echo 'seat image bake requires at least 120 GiB free on the runner' >&2
            exit 1
          fi
          memory=$(awk '/MemTotal:/ { printf "%.0f", $2 * 1024 }' /proc/meminfo)
          if test "$memory" -lt $((48 * 1024 * 1024 * 1024)); then
            echo 'seat image qualification requires at least 48 GiB RAM' >&2
            exit 1
          fi
      - name: Install the bake toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes curl jq libguestfs-tools qemu-utils
      - uses: oras-project/setup-oras@8d34698a59f5ffe24821f0600ecd270f15f0289b # v1.2.3
        with:
          version: "1.2.0"
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Bake the seat image
        env:
          APTL_BASE_IMAGE_URL: ${{ vars.APTL_BASE_IMAGE_URL }}
          APTL_BASE_IMAGE_SHA256: ${{ vars.APTL_BASE_IMAGE_SHA256 }}
          APTL_GUEST_PYTHON_VERSION: "3.14"
          LIBGUESTFS_BACKEND: direct
          APTL_SEAT_BUILD_ROOT: ${{ runner.temp }}/seat-image-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          pip install --require-hashes -r requirements/ci.txt
          pip install --require-hashes -r requirements/runtime.txt
          pip install -e . --no-deps --no-build-isolation
          scripts/appliance/build-seat-image.sh
      - name: Boot and qualify the baked seat
        env:
          LIBGUESTFS_BACKEND: direct
          APTL_SEAT_BUILD_ROOT: ${{ runner.temp }}/seat-image-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/appliance/qualify-seat-image.sh "$APTL_SEAT_BUILD_ROOT/out/seat-disk.qcow2"
      - name: Publish the seat image
        env:
          APTL_SEAT_BUILD_ROOT: ${{ runner.temp }}/seat-image-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ github.token }}
        run: scripts/appliance/publish-seat-image.sh "$APTL_SEAT_BUILD_ROOT/out"

  backmerge:
    name: Back-merge release into dev
    needs: [release-please, publish, publish-appliance-images, publish-seat-image]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open main -> dev back-merge PR
        # release-please committed the version bump + CHANGELOG.md to main, so
        # main is now ahead of dev. Auto-open a back-merge PR so dev stays
        # current. It's opened by GITHUB_TOKEN, so dev's required checks won't
        # run on it — admin-merge it (one click).
        run: |
          set -euo pipefail
          if [ "$(gh pr list --base dev --head main --state open --json number --jq 'length')" != "0" ]; then
            echo "back-merge PR main->dev already open; nothing to do."
            exit 0
          fi
          gh pr create --base dev --head main \
            --title "chore: back-merge ${{ needs.release-please.outputs.tag_name }} into dev" \
            --body "Automated back-merge of the release commit (version bump + CHANGELOG.md) from \`main\` into \`dev\` so dev stays current after the release. Admin-merge it — dev's required checks don't run on a bot-opened PR." \
            || echo "no back-merge needed (dev already up to date with main)."
