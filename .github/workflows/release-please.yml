name: Release Please

# Automated releases with release-please. On pushes to main it maintains a
# release PR (version bump + CHANGELOG.md, derived from Conventional Commit
# history). Merging that PR creates the git tag + GitHub Release; the publish
# job then builds and uploads to PyPI via OIDC trusted publishing.
#
# Third-party actions are pinned to commit SHAs (Dependabot keeps them current).
on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release tag + GitHub Release
      pull-requests: write   # open/maintain the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write        # upload release assets
      id-token: write        # OIDC trusted publishing to PyPI + provenance signing
      attestations: write    # record SLSA build provenance for the release artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        # Release tooling comes from the hashed CI export so the artifact that
        # ships to PyPI is produced by a known-good toolchain (issue #847).
        run: |
          pip install --require-hashes -r requirements/ci.txt
          python -m build --no-isolation

      - name: Generate CycloneDX SBOM
        # Install the locked runtime set plus the freshly built wheel (with
        # --no-deps, so pip resolves nothing off-lock). The SBOM then describes
        # exactly the dependency versions uv.lock pins, rather than whatever pip
        # happened to resolve at release time.
        run: |
          pip install --require-hashes -r requirements/runtime.txt
          pip install dist/*.whl --no-deps
          mkdir -p sbom
          cyclonedx-py environment --output-format JSON --output-file sbom/aptl.cdx.json

      # Sign the built artifacts with a SLSA build-provenance attestation
      # (issue #847). Sigstore keyless signing via the job's OIDC token — no key
      # material to hold or rotate. This runs BEFORE publishing so nothing
      # unattested can reach PyPI if signing fails.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

      - name: Attach artifacts to the GitHub Release
        # The attestation bundle is also attached as a release asset, not just
        # recorded in the attestations API: a consumer verifying a downloaded
        # tarball (and OpenSSF Scorecard's Signed-Releases check) looks for a
        # `.intoto.jsonl` sibling of the artifact.
        #
        # BUNDLE and TAG go through the environment rather than being
        # interpolated into the shell, so no workflow expression is ever parsed
        # as shell.
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "dist/aptl-labs-${TAG}.intoto.jsonl"
          gh release upload "$TAG" dist/* sbom/* --clobber

  publish-appliance-images:
    name: Build exact-source appliance images
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Build and publish exact-source images
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: scripts/appliance/publish-images.sh

  build-appliance-candidate:
    name: Build exact-source appliance candidate
    needs: [release-please, publish-appliance-images]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: [self-hosted, linux, x64, aptl-appliance-build]
    environment: appliance-release
    timeout-minutes: 720
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Authenticate image acquisition
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Build exact tagged candidate
        env:
          APTL_RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          APTL_BASE_IMAGE_URL: ${{ vars.APTL_BASE_IMAGE_URL }}
          APTL_BASE_IMAGE_SHA256: ${{ vars.APTL_BASE_IMAGE_SHA256 }}
          APTL_BASE_IMAGE_SIZE_BYTES: ${{ vars.APTL_BASE_IMAGE_SIZE_BYTES }}
          APTL_IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}/aptl-candidate
          APTL_GUEST_PYTHON_VERSION: "3.14"
        run: scripts/appliance/build-candidate.sh
      - name: Upload authenticated candidate transport
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appliance-candidate-${{ needs.release-please.outputs.tag_name }}
          path: build/appliance/candidate-publication/**
          if-no-files-found: error
          retention-days: 7

  qualify-appliance-a:
    name: Qualify two concurrent seats on machine A
    needs: [release-please, build-appliance-candidate]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: [self-hosted, linux, x64, kvm, aptl-appliance-a]
    environment: appliance-release
    timeout-minutes: 720
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f20822b8ad0c6f7be2f6f780d2ca264f83e23 # v8.0.1
        with:
          name: appliance-candidate-${{ needs.release-please.outputs.tag_name }}
          path: candidate-publication
      - name: Boot, exercise, revoke, and reset two concurrent seats
        env:
          APTL_CANDIDATE_PUBLICATION: ${{ github.workspace }}/candidate-publication
          APTL_QUALIFICATION_OUTPUT: ${{ github.workspace }}/machine-a.json
          APTL_QUALIFICATION_SEATS: "2"
          APTL_QUALIFICATION_SIGNING_KEY_PEM: ${{ secrets.APTL_QUALIFICATION_SIGNING_KEY_PEM }}
        run: scripts/appliance/qualify-candidate.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appliance-machine-a-${{ needs.release-please.outputs.tag_name }}
          path: |
            machine-a.json
            build/appliance-qualification/evidence/**
          if-no-files-found: error
          retention-days: 7

  qualify-appliance-b:
    name: Qualify rollback on independent machine B
    needs: [release-please, build-appliance-candidate]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: [self-hosted, linux, x64, kvm, aptl-appliance-b]
    environment: appliance-release
    timeout-minutes: 720
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f20822b8ad0c6f7be2f6f780d2ca264f83e23 # v8.0.1
        with:
          name: appliance-candidate-${{ needs.release-please.outputs.tag_name }}
          path: candidate-publication
      - name: Independently boot, exercise, revoke, and reset the candidate
        env:
          APTL_CANDIDATE_PUBLICATION: ${{ github.workspace }}/candidate-publication
          APTL_QUALIFICATION_OUTPUT: ${{ github.workspace }}/machine-b.json
          APTL_QUALIFICATION_SEATS: "1"
        run: scripts/appliance/qualify-candidate.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appliance-machine-b-${{ needs.release-please.outputs.tag_name }}
          path: machine-b.json
          if-no-files-found: error
          retention-days: 7

  seal-appliance:
    name: Seal unchanged qualified bytes for publication
    needs:
      [release-please, build-appliance-candidate, qualify-appliance-a, qualify-appliance-b]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: [self-hosted, linux, x64, aptl-appliance-seal]
    environment: appliance-release
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f20822b8ad0c6f7be2f6f780d2ca264f83e23 # v8.0.1
        with:
          pattern: appliance-*-${{ needs.release-please.outputs.tag_name }}
          path: qualified-inputs
      - name: Aggregate evidence and production-seal unchanged candidate bytes
        env:
          APTL_RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          APTL_QUALIFIED_INPUTS: ${{ github.workspace }}/qualified-inputs
          APTL_RELEASE_SIGNING_KEY_PEM: ${{ secrets.APTL_RELEASE_SIGNING_KEY_PEM }}
          APTL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.APTL_RELEASE_PUBLIC_KEY_PEM }}
          APTL_QUALIFICATION_PUBLIC_KEY_PEM: ${{ vars.APTL_QUALIFICATION_PUBLIC_KEY_PEM }}
          APTL_REDISTRIBUTION_REVIEW_JSON: ${{ secrets.APTL_REDISTRIBUTION_REVIEW_JSON }}
        run: scripts/appliance/seal-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-appliance-${{ needs.release-please.outputs.tag_name }}
          path: build/appliance-seal/publication/*
          if-no-files-found: error
          retention-days: 7

  publish-appliance:
    name: Publish qualified appliance
    needs: [release-please, seal-appliance]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f20822b8ad0c6f7be2f6f780d2ca264f83e23 # v8.0.1
        with:
          name: qualified-appliance-${{ needs.release-please.outputs.tag_name }}
          path: appliance-publication
      - name: Attest qualified distribution assets
        id: appliance-attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: appliance-publication/*
      - name: Publish without replacing existing bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxf <(find appliance-publication -maxdepth 1 -type f -printf '%f\n'); then
            echo 'an appliance release asset already exists; refusing replacement' >&2
            exit 1
          fi
          gh release upload "$TAG" appliance-publication/*

  publish-public-appliance-images:
    name: Publish qualified appliance images publicly
    needs: [release-please, seal-appliance]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - name: Make qualified packages public and prove anonymous pulls
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: scripts/appliance/verify-public-images.sh

  accept-public-appliance:
    name: Accept anonymous public appliance delivery
    needs: [release-please, publish-appliance, publish-public-appliance-images]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: [self-hosted, linux, x64, kvm, aptl-appliance-public]
    timeout-minutes: 720
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pull, download, verify, boot, call, revoke, and reset anonymously
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          APTL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.APTL_RELEASE_PUBLIC_KEY_PEM }}
          APTL_QUALIFICATION_PUBLIC_KEY_PEM: ${{ vars.APTL_QUALIFICATION_PUBLIC_KEY_PEM }}
        run: scripts/appliance/accept-public-release.sh

  backmerge:
    name: Back-merge release into dev
    needs: [release-please, publish, accept-public-appliance]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open main -> dev back-merge PR
        # release-please committed the version bump + CHANGELOG.md to main, so
        # main is now ahead of dev. Auto-open a back-merge PR so dev stays
        # current. It's opened by GITHUB_TOKEN, so dev's required checks won't
        # run on it — admin-merge it (one click).
        run: |
          set -euo pipefail
          if [ "$(gh pr list --base dev --head main --state open --json number --jq 'length')" != "0" ]; then
            echo "back-merge PR main->dev already open; nothing to do."
            exit 0
          fi
          gh pr create --base dev --head main \
            --title "chore: back-merge ${{ needs.release-please.outputs.tag_name }} into dev" \
            --body "Automated back-merge of the release commit (version bump + CHANGELOG.md) from \`main\` into \`dev\` so dev stays current after the release. Admin-merge it — dev's required checks don't run on a bot-opened PR." \
            || echo "no back-merge needed (dev already up to date with main)."
