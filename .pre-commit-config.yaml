# Local commits run secret detection and fast file hygiene only.
# Dependency freshness, complexity, prose lint and tests run in CI/CD.
fail_fast: true

repos:
  # Third-party hook repos are pinned to a commit SHA, not a tag. pre-commit
  # clones and *executes* hook code from this revision on contributor machines
  # and on clean CI runners, so a mutable tag is a code-execution boundary: an
  # attacker who can retarget the tag upstream runs arbitrary code here with no
  # change to this repository. The version stays in a trailing comment for
  # readability and for `pre-commit autoupdate`.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      # config/wazuh-certs-tool.sh is a digest-pinned vendored upstream file
      # (Wazuh 4.8 wazuh-certs-tool.sh), whose sha256 is verified in
      # generate-indexer-certs.yml before the certificate producer executes
      # it. These two hooks rewrite files in place, so letting them strip
      # trailing whitespace / fix the final newline changes the file's
      # sha256, breaks the pin, and fails certificate generation on every
      # `aptl lab start`. Keep the vendored tool byte-identical to upstream.
      - id: trailing-whitespace
        exclude: ^(config/suricata/rules/.*\.rules|config/wazuh-certs-tool\.sh)$
      - id: end-of-file-fixer
        exclude: ^(config/suricata/rules/.*\.rules|config/wazuh-certs-tool\.sh)$
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
        # Scenario SDL inventories are authored evidence surfaces and can
        # exceed 500 KB without being accidental binary/blob additions.
        exclude: ^scenarios/.*\.sdl\.yaml$
      - id: check-merge-conflict
      - id: detect-private-key
        # `tests/` historically holds private-key-shaped fixtures.
        # `mcp/aptl-mcp-common/{src,tests}/redaction.{ts,test.ts}` and
        # `src/aptl/utils/redaction.py` (+ its test) intentionally embed
        # PEM block markers — they implement and verify masking of those
        # markers, not real key material.
        exclude: |
          (?x)^(
            tests/.*|
            mcp/aptl-mcp-common/src/redaction\.ts|
            mcp/aptl-mcp-common/tests/redaction\.test\.ts|
            src/aptl/utils/redaction\.py
          )$
