name: Publish seat image for an existing release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag for this corrected seat build
        required: true
        type: string
      source_ref:
        description: Ref containing the corrected bake and the release version
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-seat-image:
    runs-on: [self-hosted, linux, x64, aptl-seat-image]
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Verify the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          curl --fail --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Verify source version
        env:
          EXPECTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          test "v${version}" = "$EXPECTED_TAG" || {
            echo 'source version does not match the requested release tag' >&2
            exit 1
          }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
      - name: Check bake workspace capacity
        run: |
          set -euo pipefail
          available=$(df -PB1 "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')
          if test "$available" -lt $((120 * 1024 * 1024 * 1024)); then
            echo 'seat image bake requires at least 120 GiB free on the runner' >&2
            exit 1
          fi
          memory=$(awk '/MemTotal:/ { printf "%.0f", $2 * 1024 }' /proc/meminfo)
          if test "$memory" -lt $((48 * 1024 * 1024 * 1024)); then
            echo 'seat image qualification requires at least 48 GiB RAM' >&2
            exit 1
          fi
      - name: Install the bake toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes curl jq libguestfs-tools qemu-utils
      - uses: oras-project/setup-oras@8d34698a59f5ffe24821f0600ecd270f15f0289b # v1.2.3
        with:
          version: "1.2.0"
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Bake the seat image
        env:
          APTL_BASE_IMAGE_URL: ${{ vars.APTL_BASE_IMAGE_URL }}
          APTL_BASE_IMAGE_SHA256: ${{ vars.APTL_BASE_IMAGE_SHA256 }}
          APTL_GUEST_PYTHON_VERSION: "3.14"
          LIBGUESTFS_BACKEND: direct
          APTL_SEAT_BUILD_ROOT: ${{ runner.temp }}/seat-image-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          pip install --require-hashes -r requirements/ci.txt
          pip install --require-hashes -r requirements/runtime.txt
          pip install -e . --no-deps --no-build-isolation
          scripts/appliance/build-seat-image.sh
      - name: Boot and qualify the baked seat
        env:
          LIBGUESTFS_BACKEND: direct
          APTL_SEAT_BUILD_ROOT: ${{ runner.temp }}/seat-image-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/appliance/qualify-seat-image.sh "$APTL_SEAT_BUILD_ROOT/out/seat-disk.qcow2"
      - name: Publish and verify anonymous pull
        env:
          GHCR_TOKEN: ${{ github.token }}
          APTL_SEAT_BUILD_ROOT: ${{ runner.temp }}/seat-image-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/appliance/publish-seat-image.sh "$APTL_SEAT_BUILD_ROOT/out"
